<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('financeAppTheme');
        if (t === 'oscuro' || t === 'claro') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#8b5cf6">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>Presupuestos · Mis Finanzas</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="presupuestos">
  <button class="theme-toggle-btn" id="theme-toggle" aria-label="Cambiar tema">🌙</button>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-header">
        <span class="logo-mark">💸</span>
        <span class="logo-text">Finanzas</span>
      </div>
      <nav id="sidebar-nav" class="sidebar-nav"></nav>
    </aside>

    <main class="main-content">
      <header class="page-header">
        <div>
          <h1>Presupuestos</h1>
          <p class="page-subtitle">Define un límite mensual por categoría y controla tu gasto</p>
        </div>
      </header>

      <section class="card">
        <div id="presupuestos-list" class="budget-list"></div>
      </section>
    </main>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/format.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/presupuestos.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
